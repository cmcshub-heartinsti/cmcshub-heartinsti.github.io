name: Deploy CMCS-Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CMCS-Hub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard repository contents
        working-directory: .
        run: |
          # The repository publishes the static site only: site source, the
          # deploy workflow, .gitignore and README.md. Anything else (docs,
          # scripts, environment files, large artefacts) must not be tracked.
          unexpected=$(git ls-files | grep -vE '^(CMCS-Hub/|\.github/workflows/deploy-pages\.yml$|\.gitignore$|README\.md$)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected tracked files — only the static site source may be committed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "OK: $(git ls-files | wc -l) tracked files, all part of the static site."

      - name: Show baseURL in use
        run: grep -n '^baseURL' config.toml

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Build site
        run: hugo --gc --minify --cleanDestinationDir --logLevel info

      - name: Fail if output is empty
        run: |
          test -f public/index.html
          echo "pages: $(find public -name 'index.html' | wc -l)"
          echo "size:  $(du -sh public | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: CMCS-Hub/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
