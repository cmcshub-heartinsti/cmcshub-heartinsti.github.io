{{ define "main" }}
<section class="page-section">
  <div class="page-container">
    <header class="page-header">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ with .Description }}<p class="page-desc">{{ . }}</p>{{ end }}
    </header>
    {{ partial "data-request-form.html" . }}
    <div class="contact-card mt-8">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
