baseURL = "https://cmcshub-heartinsti.github.io/"
locale = "en-us"
title = "CMCS-Hub"
theme = "cmcs-hub"

ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]

disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "CMCS-Hub: Cardiovascular Multi-Omics Hub — Risk Factor Discovery, Multi-Omics Integration, Drug Target Screening, and Precision Risk Assessment"
  author = "CMCS-Hub"
  dataFormEndpoint = ""
  # Data Request form backend (Formspree). Paste the form ID from
  # https://formspree.io/forms (looks like "mqkrvbzp"); the form then POSTs to
  # https://formspree.io/f/<id>. Leave empty to fall back to opening the
  # visitor's email client (mailto:) with the request pre-filled.
  formspreeFormId = ""
  requestEmail = "cmcshub2026@163.com"

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
  name = "News/Events"
  url = "/news/"
  weight = 2

[[menus.main]]
  name = "Research"
  url = "/research/"
  weight = 3

[[menus.main]]
  name = "Publications"
  url = "/publications/"
  weight = 4

[[menus.main]]
  name = "Data"
  url = "/data/"
  weight = 5
